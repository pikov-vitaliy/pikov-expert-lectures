name: appsec-day2-ssrf

services:
  gateway:
    build:
      context: ./gateway
    ports:
      - "127.0.0.1:${SSRF_LAB_PORT:-8080}:8080"
    networks:
      - edge
      - labnet
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    labels:
      expert.pikov.lab: appsec-day2-ssrf
      expert.pikov.config: appsec-day2-ssrf-v1

  app:
    build:
      context: ./app
    expose:
      - "8080"
    networks:
      - labnet
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    labels:
      expert.pikov.lab: appsec-day2-ssrf
      expert.pikov.config: appsec-day2-ssrf-v1

  internal:
    build:
      context: ./internal
    expose:
      - "9000"
    networks:
      - labnet
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    labels:
      expert.pikov.lab: appsec-day2-ssrf
      expert.pikov.config: appsec-day2-ssrf-v1

networks:
  edge:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
    labels:
      expert.pikov.lab: appsec-day2-ssrf
      expert.pikov.config: appsec-day2-ssrf-v1
  labnet:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    labels:
      expert.pikov.lab: appsec-day2-ssrf
      expert.pikov.config: appsec-day2-ssrf-v1
