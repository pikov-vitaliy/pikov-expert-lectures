name: Site checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed range formatting
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $baseCandidate = $env:BASE_SHA
          if ([string]::IsNullOrWhiteSpace($baseCandidate) -or $baseCandidate -match '^0+$') {
            $baseCandidate = 'HEAD^'
          }
          $baseSha = (git merge-base $baseCandidate HEAD).Trim()
          if ([string]::IsNullOrWhiteSpace($baseSha)) {
            throw 'Could not resolve the changed-range merge base'
          }
          git diff --check "$baseSha..HEAD"

      - name: Parse project scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            '_PROJECT/smoke-check.ps1',
            '_PROJECT/update-site-control-files.ps1',
            '_PROJECT/build-release.ps1',
            '_PROJECT/test-public-release-independence.ps1',
            '_PROJECT/hosting-check.ps1',
            '_PROJECT/deploy-hosting.ps1'
          )) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $script -Raw -Encoding UTF8))
          }

      - name: Parse Windows PowerShell lab wrappers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            'pentest/lab/preflight-juice-shop-lab.ps1',
            'pentest/lab/start-juice-shop-lab.ps1',
            'pentest/lab/stop-juice-shop-lab.ps1'
          )) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $script -Raw -Encoding UTF8))
          }

      - name: Run smoke check
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\_PROJECT\smoke-check.ps1

      - name: Build canonical AppSec handouts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\appsec-lections\_build\build-materials-zip.ps1

      - name: Run content regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test .\_PROJECT\test-international-content-currentness.mjs
          node .\_PROJECT\test-platform-content-currentness.mjs
          node --test .\_PROJECT\test-evergreen-course-dates.mjs
          node --test .\_PROJECT\test-main-rbpo-publication.mjs
          node --test .\_PROJECT\test-release-workflow-order.mjs
          node --test .\_PROJECT\test-release-provenance.mjs
          node --test .\_PROJECT\test-deploy-manifest-boundary.mjs
          node --test .\_PROJECT\test-root-learning-paths.mjs
          node --test .\_PROJECT\test-root-bilingual.mjs
          node --test .\_PROJECT\test-root-professional-profile.mjs
          node --test .\_PROJECT\test-root-locale-routes.mjs
          node .\_PROJECT\build-root-locales.mjs --check
          node --test .\_PROJECT\test-public-affiliation-hygiene.mjs
          powershell -NoProfile -ExecutionPolicy Bypass -File .\_PROJECT\test-public-release-independence.ps1 -PolicySelfTest
          node --test .\_PROJECT\test-tz-landing.mjs
          node .\tz\tools\build-tz-landing.mjs --check
          node --test .\_PROJECT\test-spdx-page-metadata.mjs
          node .\_PROJECT\update-spdx-page-metadata.mjs --root .\spdx --check
          node --test .\_PROJECT\test-generated-artifact-determinism.mjs
          node .\_PROJECT\test-pentest-materials.mjs
          python .\appsec-lections\_build\security_regression_tests.py -v
          python .\pentest\lab\dvwa-safety-test.py -v
          python .\pentest\lab\juice-shop-safety-test.py -v
          Push-Location .\29-07-2026\code
          try {
            $env:REGISTRY_MODULE = 'step3_student_solution'
            python -m unittest test_student test_examples -v
          }
          finally {
            Remove-Item Env:REGISTRY_MODULE -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Install pinned browser test dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --prefix .\_PROJECT\.browser-node --ignore-scripts --no-audit --no-fund
          & .\_PROJECT\.browser-node\node_modules\.bin\playwright.cmd install chromium

      - name: Run focused browser regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --test .\_PROJECT\test-course-map.mjs
          node --test .\_PROJECT\test-27-07-accessible-handout.mjs
          node .\_PROJECT\test-layout-accessibility-regressions.mjs
          node .\_PROJECT\qa-root-index.mjs
          node .\_PROJECT\qa-root-locale-routes.mjs
          node --test .\_PROJECT\qa-tz-navigation.mjs
          node .\_PROJECT\qa-pentest-ui.mjs
          node .\_PROJECT\qa-appsec-layout.mjs

      - name: Build release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sourceCommit = (git rev-parse --verify HEAD).Trim().ToLowerInvariant()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve the exact workflow source commit: $sourceCommit"
          }
          $isAcceptedMain = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          if ($isAcceptedMain) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\_PROJECT\build-release.ps1 -FailOnIssues -AcceptedSourceCommit $sourceCommit
          }
          else {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\_PROJECT\build-release.ps1 -FailOnIssues
          }
          "RELEASE_SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ACCEPTED_MAIN=$($isAcceptedMain.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify release build did not change tracked files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $trackedDrift = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect tracked files after release build'
          }
          if ($trackedDrift.Count -ne 0) {
            $trackedDrift | ForEach-Object { Write-Host $_ }
            throw 'Tracked files changed during release build'
          }

      - name: Verify public release independence
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\_PROJECT\test-public-release-independence.ps1

      - name: Run release browser QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node .\_PROJECT\browser-qa.mjs

      - name: Prepare deploy script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_ACCEPTED_MAIN -eq 'true') {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\_PROJECT\deploy-hosting.ps1 -PrepareOnly -ExpectedSourceCommit $env:RELEASE_SOURCE_COMMIT
            if ($LASTEXITCODE -ne 0) { throw "Accepted main PrepareOnly failed with exit code $LASTEXITCODE" }
          }
          else {
            $oldNativePreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            try {
              $rejection = & powershell -NoProfile -ExecutionPolicy Bypass -File .\_PROJECT\deploy-hosting.ps1 -PrepareOnly -ExpectedSourceCommit $env:RELEASE_SOURCE_COMMIT 2>&1
              $rejectionExit = $LASTEXITCODE
            }
            finally {
              $PSNativeCommandUseErrorActionPreference = $oldNativePreference
            }
            $rejection | ForEach-Object { Write-Host $_ }
            if ($rejectionExit -eq 0) { throw 'Candidate release was unexpectedly accepted by the deploy gate' }
            if (($rejection -join "`n") -notmatch '(?i)accepted|deployable|ancestor|main') {
              throw 'Candidate rejection did not come from an accepted-main provenance gate'
            }
            Write-Host 'Candidate release rejection verified.'
            # GitHub's pwsh wrapper exits with the last native exit code even after
            # an expected rejection has been validated, so clear only that stale code.
            $global:LASTEXITCODE = 0
          }
