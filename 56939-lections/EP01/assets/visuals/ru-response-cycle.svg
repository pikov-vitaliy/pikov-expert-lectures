sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="79" dy="0">04</tspan></text><text x="79" y="412.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="79" dy="0">Сопровождение</tspan></text><text x="79" y="454.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="79" dy="0">Обновление и обратная связь</tspan></text><text x="800" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="800" dy="0">Версия + решение</tspan></text></svg>
