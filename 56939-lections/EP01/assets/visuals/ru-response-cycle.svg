<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title description" lang="ru"><title id="title">Работа с недостатком связывает регистрацию и анализ сообщения, решение об ответственных и действиях, исправление с проверкой, а затем обновление и сопровождение. Версия продукта и принятое решение должны оставаться прослеживаемыми.</title><desc id="description">Учебная схема работы с недостатком на протяжении сопровождения продукта.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="520" rx="16" fill="#ffffff" /><line x1="665" y1="100" x2="935" y2="100" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><line x1="1250" y1="188" x2="1250" y2="320" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><line x1="935" y1="412" x2="675" y2="412" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><line x1="360" y1="320" x2="360" y2="198" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="55" y="18" width="600" height="170" rx="16" fill="#edf3fa" /><rect x="55" y="18" width="7" height="170" rx="3" fill="#245dba" /><text x="79" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight