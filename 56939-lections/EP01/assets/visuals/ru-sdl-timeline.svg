<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title description" lang="ru"><title id="title">Выбранные публикации и редакции: исследование жизненного цикла 2004 года; SDL, Touchpoints и CLASP в 2006 году; руководство SDL-Agile v5.2 в 2012 году; сингапурский Security-by-Design в 2017 году; SAMM v2.0 в 2020 году; SSDF v1.1 в 2022 году. Это не даты первого возникновения всех идей.</title><desc id="description">Выбранные публикации и редакции из истории методологий. Обзор рассматривает 28 подходов; шкала не исчерпывает их историю.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="520" rx="16" fill="#ffffff" /><line x1="90" y1="257" x2="1520" y2="257" stroke="#43566c" stroke-width="5" fill="none" /><line x1="120.0" y1="249" x2="120.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="195.55555555555554" y1="249" x2="195.55555555555554" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="271.1111111111111" y1="249" x2="271.1111111111111" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="346.66666666666663" y1="249" x2="346.66666666666663" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="422.22222222222223" y1="249" x2="422.2222222222222