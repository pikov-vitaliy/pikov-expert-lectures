<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 510" width="1600" height="510" role="img" aria-labelledby="title description" lang="en"><title id="title">Two partial overlaps are shown: GOST 5.1.3.4 and NIST SSDF PO.2.1 share a concern with roles and responsibility; GOST 5.1.2.3 and SAMM Strategy and Metrics share a concern with an improvement roadmap. Scope and evidence expectations still differ.</title><desc id="description">Bounded comparison: a shared concern is useful, but does not establish full equivalence.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="510" rx="16" fill="#ffffff" /><rect x="40" y="34" width="420" height="162" rx="16" fill="#edf3fa" /><rect x="40" y="34" width="7" height="162" rx="3" fill="#245dba" /><text x="64" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="64" dy="0">GOST 5.1.3.4</tspan></text><rect x="1140" y="34" width="420" height="162" rx="16" fill="#edf3fa" /><rect x="1140" y="34" width="7" height="162" rx="3" fill="#147b70" /><text x="1164" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="1164" dy="0">SSDF PO.2.1</tspan></text><line x1="470" y1="114" x2="1130" y2="114" stroke="#43566c" stroke-width="3" fill="none" stroke-dasharray="10 9" /><rect x="540" y="42" width="520" height="138" rx="16" fill="#ffffff" stroke="#b8c9db" stroke-width="3" /><text x="800" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="800" dy="0">Roles &amp; responsibility</tspan></text><text x="800" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#147b70" text-anchor="middle"><tspan x="800" dy="0">Partial overlap</tspan></text><rect x="40" y="251" width="420" height="162" rx="16" fill="#edf3fa" /><rect x="40" y="251" width="7" height="162" rx="3" fill="#245dba" /><text x="64" y="297" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="64" dy="0">GOST 5.1.2.3</tspan></text><rect x="1140" y="251" width="420" height="162" rx="16" fill="#edf3fa" /><rect x="1140" y="251" width="7" height="162" rx="3" fill="#147b70" /><text x="1164" y="297" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="1164" dy="0">SAMM Strategy &amp;</tspan><tspan x="1164" dy="40.12">Metrics</tspan></text><line x1="470" y1="331" x2="1130" y2="331" stroke="#43566c" stroke-width="3" fill="none" stroke-dasharray="10 9" /><rect x="540" y="259" width="520" height="138" rx="16" fill="#ffffff" stroke="#b8c9db" stroke-width="3" /><text x="800" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="800" dy="0">Improvement roadmap</tspan></text><text x="800" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#147b70" text-anchor="middle"><tspan x="800" dy="0">Partial overlap</tspan></text><text x="800" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">Partial overlap in both rows. Compare the full wording, scope and evidence expectations.</tspan></text></svg>
