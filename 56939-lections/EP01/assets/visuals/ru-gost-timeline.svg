f" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="1140.0" dy="0">Утверждение</tspan></text><text x="1140.0" y="144.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="1140.0" dy="0">Росстандарт · №</tspan><tspan x="1140.0" dy="33.04">458-ст</tspan></text><path d="M1480.0 257 V282 H1413.0 V302" stroke="#147b70" stroke-width="4" fill="none" stroke-linejoin="round" /><circle cx="1480.0" cy="257" r="10" fill="#147b70" stroke="#ffffff" stroke-width="4" /><text x="1413.0" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="750" fill="#147b70" text-anchor="middle"><tspan x="1413.0" dy="0">1 июня 2017</tspan></text><text x="1413.0" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="1413.0" dy="0">Введение в</tspan><tspan x="1413.0" dy="40.12">действие</tspan></text><text x="1413.0" y="468.12" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="1413.0" dy="0">ГОСТ Р 56939-2016</tspan></text></svg>
