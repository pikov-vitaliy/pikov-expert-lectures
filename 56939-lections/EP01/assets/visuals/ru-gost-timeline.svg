<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title description" lang="ru"><title id="title">В апреле 2013 года началась НИР, в августе появился первый проект; в 2014–2015 годах продолжались рассмотрение и доработка; 1 июня 2016 года Росстандарт утвердил ГОСТ Р 56939-2016; 1 июня 2017 года стандарт введён в действие. Проектные этапы приведены по докладу Вареницы, две последние даты — по окончательному стандарту.</title><desc id="description">Подготовка проекта, утверждение и введение стандарта в действие — разные этапы.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="520" rx="16" fill="#ffffff" /><line x1="90" y1="257" x2="1520" y2="257" stroke="#43566c" stroke-width="5" fill="none" /><line x1="120.0" y1="249" x2="120.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="460.0" y1="249" x2="460.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="800.0" y1="249" x2="800.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="1140.0" y1="249" x2="1140.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="1480.0" y1="249" x2="1480.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><path d="M120.0 257 V220 H187.0 V202" stroke=