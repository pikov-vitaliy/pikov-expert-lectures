<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 475" width="1600" height="475" role="img" aria-labelledby="title description" lang="en"><title id="title">The importer scenario returns with a connected path: identify the input and covered parser, retain the finding evidence, assign time and ownership for investigation, and record a release decision under the team's policy. This is a review of the process, not proof that a release is safe.</title><desc id="description">Return to Friday's release: can the team follow the finding through an owned, evidenced decision?</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="475" rx="16" fill="#ffffff" /><line x1="303" y1="244" x2="335" y2="244" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="35" y="130" width="267" height="225" rx="16" fill="#edf3fa" /><rect x="35" y="130" width="7" height="225" rx="3" fill="#245dba" /><text x="59" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="59" dy="0">SCOPE</tspan></text><text x="59" y="212.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="59" dy="0">Input file</tspan></text><text x="59" y="254.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="59" dy="0">Relevant</tspan><tspan x="59" dy="33.04">scenario</tspan></text><line x1="615" y1="244" x2="647" y2="244" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="347" y="130" width="267" height="225" rx="16" fill="#edf3fa" /><rect x="347" y="130" width="7" height="225" rx="3" fill="#245dba" /><text x="371" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="371" dy="0">VERSION</tspan></text><text x="371" y="212.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="371" dy="0">Parser</tspan></text><text x="371" y="254.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="371" dy="0">Covered</tspan><tspan x="371" dy="33.04">component</tspan></text><line x1="927" y1="244" x2="959" y2="244" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="659" y="130" width="267" height="225" rx="16" fill="#edf3fa" /><rect x="659" y="130" width="7" height="225" rx="3" fill="#245dba" /><text x="683" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="683" dy="0">EVIDENCE</tspan></text><text x="683" y="212.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="683" dy="0">Finding</tspan></text><text x="683" y="254.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="683" dy="0">Recorded</tspan><tspan x="683" dy="33.04">result</tspan></text><line x1="1239" y1="244" x2="1271" y2="244" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="971" y="130" width="267" height="225" rx="16" fill="#edf3fa" /><rect x="971" y="130" width="7" height="225" rx="3" fill="#245dba" /><text x="995" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="995" dy="0">CAPACITY</tspan></text><text x="995" y="212.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="995" dy="0">Investigate</tspan></text><text x="995" y="254.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="995" dy="0">Owner and time</tspan></text><rect x="1283" y="130" width="267" height="225" rx="16" fill="#edf3fa" /><rect x="1283" y="130" width="7" height="225" rx="3" fill="#245dba" /><text x="1307" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="1307" dy="0">POLICY</tspan></text><text x="1307" y="212.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="1307" dy="0">Decide</tspan></text><text x="1307" y="254.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="1307" dy="0">Decision and</tspan><tspan x="1307" dy="33.04">review</tspan></text><text x="800" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">A usable decision process does not predetermine whether the release should proceed.</tspan></text></svg>
