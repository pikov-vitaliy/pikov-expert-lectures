<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" width="1600" height="490" role="img" aria-labelledby="title description" lang="en"><title id="title">The comparison method proceeds from reading actors, actions and conditions, to examining differences, demonstrating an implementation, and stating a bounded conclusion.</title><desc id="description">Compare what the documents ask people to do and what would demonstrate the result.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="490" rx="16" fill="#ffffff" /><line x1="395.5" y1="238" x2="433.5" y2="238" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="60.0" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="60.0" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="84.0" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="84.0" dy="0">01</tspan></text><text x="84.0" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="84.0" dy="0">Read</tspan></text><text x="84.0" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="84.0" dy="0">Actor, action,</tspan><tspan x="84.0" dy="33.04">conditions</tspan></text><line x1="779.0" y1="238" x2="817.0" y2="238" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="443.5" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="443.5" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="467.5" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="467.5" dy="0">02</tspan></text><text x="467.5" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="467.5" dy="0">Compare</tspan></text><text x="467.5" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="467.5" dy="0">Shared intent,</tspan><tspan x="467.5" dy="33.04">differences</tspan></text><line x1="1162.5" y1="238" x2="1200.5" y2="238" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="827.0" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="827.0" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="851.0" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="851.0" dy="0">03</tspan></text><text x="851.0" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="851.0" dy="0">Demonstrate</tspan></text><text x="851.0" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="851.0" dy="0">Example and</tspan><tspan x="851.0" dy="33.04">evidence</tspan></text><rect x="1210.5" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="1210.5" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="1234.5" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="1234.5" dy="0">04</tspan></text><text x="1234.5" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="1234.5" dy="0">Conclude</tspan></text><text x="1234.5" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="1234.5" dy="0">State the limits</tspan></text><text x="800" y="472.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">Partial overlap is useful; it does not establish full equivalence.</tspan></text></svg>
