<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" width="1600" height="490" role="img" aria-labelledby="title description" lang="ru"><title id="title">Для сервиса обработки файлов выявленный пробел — отсутствие общего порядка обработки предупреждений — связывается с улучшением, задачей с участником и сроком, затем с сохранённым результатом проверки реального изменения.</title><desc id="description">Практическая работа: проследите связь от выявленного пробела до результата исполнения.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="490" rx="16" fill="#ffffff" /><line x1="395.5" y1="238" x2="433.5" y2="238" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="60.0" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="60.0" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="84.0" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="84.0" dy="0">ПРОБЛЕМА</tspan></text><text x="84.0" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="84.0" dy="0">Пробел</tspan></text><text x="84.0" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="84.0" dy="0">Нет порядка</tspan><tspan x="84.0" dy="33.04">обработки</tspan></text><line x1="779.0" y1="238" x2="817.0" y2="238" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="443.5" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="443.5" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="467.5" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="467.5" dy="0">ПРИОРИТЕТ</tspan></text><text x="467.5" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="467.5" dy="0">Улучшение</tspan></text><text x="467.5" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="467.5" dy="0">Согласовать</tspan><tspan x="467.5" dy="33.04">действия</tspan></text><line x1="1162.5" y1="238" x2="1200.5" y2="238" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="827.0" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="827.0" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="851.0" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="851.0" dy="0">ИСПОЛНЕНИЕ</tspan></text><text x="851.0" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="851.0" dy="0">Работа</tspan></text><text x="851.0" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="851.0" dy="0">Участник и срок</tspan></text><rect x="1210.5" y="105" width="329.5" height="282" rx="16" fill="#edf3fa" /><rect x="1210.5" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="1234.5" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="1234.5" dy="0">ПРОВЕРКА</tspan></text><text x="1234.5" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="1234.5" dy="0">Результат</tspan></text><text x="1234.5" y="229.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="1234.5" dy="0">Реальное изменение</tspan></text><text x="800" y="472.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">Каждая связь должна объясняться исходным состоянием, областью и доступными ресурсами.</tspan></text></svg>
