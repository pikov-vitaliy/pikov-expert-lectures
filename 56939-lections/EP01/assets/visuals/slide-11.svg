<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-labelledby="title description" lang="en"><title id="title">On a common time axis, GOST R 56939 was approved in 2016; the first public SSDF draft appeared in 2019, final SSDF 1.0 in 2020, and final SSDF 1.1 in 2022. The timeline does not assert ancestry between the documents.</title><desc id="description">Chronology helps test an ancestry claim; similarity alone cannot establish one.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="520" rx="16" fill="#ffffff" /><line x1="90" y1="257" x2="1520" y2="257" stroke="#43566c" stroke-width="5" fill="none" /><line x1="120.0" y1="249" x2="120.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="346.66666666666663" y1="249" x2="346.66666666666663" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="573.3333333333333" y1="249" x2="573.3333333333333" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="800.0" y1="249" x2="800.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="1026.6666666666665" y1="249" x2="1026.6666666666665" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="1253.3333333333335" y1="249" x2="1253.3333333333335" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><line x1="1480.0" y1="249" x2="1480.0" y2="265" stroke="#43566c" stroke-width="2" fill="none" /><path d="M120.0 257 V220 H187.0 V202" stroke="#245dba" stroke-width="4" fill="none" stroke-linejoin="round" /><circle cx="120.0" cy="257" r="10" fill="#245dba" stroke="#ffffff" stroke-width="4" /><text x="187.0" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="750" fill="#245dba" text-anchor="middle"><tspan x="187.0" dy="0">2016</tspan></text><text x="187.0" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="187.0" dy="0">GOST R 56939</tspan></text><text x="187.0" y="144.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="187.0" dy="0">Approved</tspan></text><path d="M800.0 257 V282 H800.0 V302" stroke="#245dba" stroke-width="4" fill="none" stroke-linejoin="round" /><circle cx="800.0" cy="257" r="10" fill="#245dba" stroke="#ffffff" stroke-width="4" /><text x="800.0" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="750" fill="#245dba" text-anchor="middle"><tspan x="800.0" dy="0">2019</tspan></text><text x="800.0" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="800.0" dy="0">SSDF public draft</tspan></text><text x="800.0" y="428.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800.0" dy="0">11 June</tspan></text><path d="M1026.6666666666665 257 V220 H1026.6666666666665 V202" stroke="#245dba" stroke-width="4" fill="none" stroke-linejoin="round" /><circle cx="1026.6666666666665" cy="257" r="10" fill="#245dba" stroke="#ffffff" stroke-width="4" /><text x="1026.6666666666665" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="750" fill="#245dba" text-anchor="middle"><tspan x="1026.6666666666665" dy="0">2020</tspan></text><text x="1026.6666666666665" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="1026.6666666666665" dy="0">SSDF 1.0</tspan></text><text x="1026.6666666666665" y="144.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="1026.6666666666665" dy="0">Final white paper</tspan></text><path d="M1480.0 257 V282 H1413.0 V302" stroke="#245dba" stroke-width="4" fill="none" stroke-linejoin="round" /><circle cx="1480.0" cy="257" r="10" fill="#245dba" stroke="#ffffff" stroke-width="4" /><text x="1413.0" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="750" fill="#245dba" text-anchor="middle"><tspan x="1413.0" dy="0">2022</tspan></text><text x="1413.0" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="1413.0" dy="0">SSDF 1.1</tspan></text><text x="1413.0" y="428.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="1413.0" dy="0">NIST SP 800-218</tspan></text></svg>
