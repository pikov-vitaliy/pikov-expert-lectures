<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" width="1600" height="540" role="img" aria-labelledby="title description" lang="en"><title id="title">Importer 2.0 contains the parser, service API and shipped libraries. Repository, CI configuration and release workflow form connected development context. Excluding a retired prototype requires evidence that it has no code or dependency path into the release.</title><desc id="description">Illustrative scope: record what is included, what is connected and why an exclusion is justified.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="540" rx="16" fill="#ffffff" /><rect x="35" y="25" width="970" height="365" rx="22" fill="#ffffff" stroke="#245dba" stroke-width="3" stroke-dasharray="13 7" /><text x="70" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="70" dy="0">Importer 2.0</tspan></text><rect x="80.0" y="155" width="264.6666666666667" height="150" rx="16" fill="#edf3fa" /><text x="212.33333333333334" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" fill="#15334f" text-anchor="middle"><tspan x="212.33333333333334" dy="0">Parser</tspan><tspan x="212.33333333333334" dy="41.3">module</tspan></text><