<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="title description" lang="en"><title id="title">The illustrative plan has three equal 30-day periods: establish scope, baseline and ownership; integrate parser checks and record decisions; then review two release cycles, close gaps and update the next plan.</title><desc id="description">A 90-day example for the importer: each stage produces something the team can review.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="500" rx="16" fill="#ffffff" /><line x1="45" y1="88" x2="540" y2="88" stroke="#245dba" stroke-width="6" fill="none" marker-end="url(#arrow-blue)" /><circle cx="55" cy="88" r="13" fill="#245dba" /><rect x="45" y="143" width="470" height="280" rx="16" fill="#edf3fa" /><rect x="45" y="143" width="7" height="280" rx="3" fill="#245dba" /><text x="69" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="69" dy="0">Days 1–30</tspan></text><text x="69" y="225.0" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="69" dy="0">Establish baseline</tspan></text><text x="69" y="267.0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="69" dy="0">Scope, owners, capacity</tspan></text><line x1="555" y1="88" x2="1050" y2="88" stroke="#245dba" stroke-width="6" fill="none" marker-end="url(#arrow-blue)" /><circle cx="565" cy="88" r="13" fill="#245dba" /><rect x="555" y="143" width="470" height="280" rx="16" fill="#edf3fa" /><rect x="555" y="143" width="7" height="280" rx="3" fill="#245dba" /><text x="579" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="579" dy="0">Days 31–60</tspan></text><text x="579" y="225.0" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="579" dy="0">Integrate &amp; record</tspan></text><text x="579" y="267.0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="579" dy="0">CI checks, triage evidence</tspan></text><line x1="1065" y1="88" x2="1560" y2="88" stroke="#147b70" stroke-width="6" fill="none" /><circle cx="1075" cy="88" r="13" fill="#147b70" /><rect x="1065" y="143" width="470" height="280" rx="16" fill="#edf3fa" /><rect x="1065" y="143" width="7" height="280" rx="3" fill="#147b70" /><text x="1089" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#147b70" text-anchor="start"><tspan x="1089" dy="0">Days 61–90</tspan></text><text x="1089" y="225.0" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="1089" dy="0">Review &amp; improve</tspan></text><text x="1089" y="267.0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#43566c" text-anchor="start"><tspan x="1089" dy="0">Two cycles, next plan</tspan></text><text x="800" y="482.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">Illustrative implementation choices, not a timetable required by GOST.</tspan></text></svg>
