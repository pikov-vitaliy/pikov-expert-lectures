<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" width="1600" height="490" role="img" aria-labelledby="title description" lang="en"><title id="title">A process improvement goal, repeatable parser checks, is linked to an implementation task with an owner and milestone, and then to evidence of coverage and triage decisions. Current-state and resource analysis support the entire chain.</title><desc id="description">Connect the capability in the improvement plan to executable work and its evidence.</desc><defs><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#245dba" /></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#147b70" /></marker><marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#996315" /></marker><marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#43566c" /></marker></defs><rect x="0" y="0" width="1600" height="490" rx="16" fill="#ffffff" /><line x1="523.3333333333333" y1="238" x2="561.3333333333333" y2="238" stroke="#245dba" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" /><rect x="60.0" y="105" width="457.3333333333333" height="282" rx="16" fill="#edf3fa" /><rect x="60.0" y="105" width="7" height="282" rx="3" fill="#245dba" /><text x="84.0" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#245dba" text-anchor="start"><tspan x="84.0" dy="0">IMPROVEMENT PLAN</tspan></text><text x="84.0" y="187.0" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="84.0" dy="0">Capability</tspan></text><text x="84.0" y=