t-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">Shared foundation: current-state analysis and resource analysis. The plans may be linked in one</tspan><tspan x="800" dy="33.04">tracker.</tspan></text></svg>
