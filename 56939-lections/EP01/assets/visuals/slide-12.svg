Arial, sans-serif" font-size="33" font-weight="650" fill="#15334f" text-anchor="start"><tspan x="93" dy="0">Recommendation · clause 4.2</tspan></text><rect x="870" y="28" width="685" height="444" rx="14" fill="#ffffff" stroke="#147b70" stroke-width="3" /><path d="M1470 28 V110 H1555" stroke="#147b70" stroke-width="4" fill="none" stroke-linejoin="round" /><text x="908" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="750" fill="#147b70" text-anchor="start"><tspan x="908" dy="0">2024</tspan></text><text x="908" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#15334f" text-anchor="start"><tspan x="908" dy="0">25 named processes</tspan></text><rect x="895" y="325" width="635" height="118" rx="16" fill="#edf3fa" /><text x="918" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="650" fill="#15334f" text-anchor="start"><tspan x="918" dy="0">Requirement · clause 4.7</tspan></text><text x="800" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="650" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">≠</tspan></text><text x="800" y="497.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#43566c" text-anchor="middle"><tspan x="800" dy="0">Different structural units: 25 minus 9 is not a measure of improvement.</tspan></text></svg>
